<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="年末のカニ・海鮮特集">
  <rect width="1600" height="520" fill="#10161f"/>
  <rect x="0" y="0" width="1600" height="10" fill="#c83333"/>
  <circle cx="1390" cy="110" r="150" fill="#c83333" opacity="0.16"/>
  <circle cx="1460" cy="400" r="90" fill="#c83333" opacity="0.10"/>
  <text x="90" y="150" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="34" letter-spacing="6" fill="#e8b4b4">季節特集｜年末年始の食卓</text>
