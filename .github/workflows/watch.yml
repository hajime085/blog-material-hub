name: 特価の見張り

# 1日4回、価格を見に行き、変化があればサイトを作り直して反映する。
#
# 以前は1日7回にしていたが、GitHub の予定実行は回数を増やすほど
# 届かなくなる（8/27 は 6回中1回、8/28 は 3回中0回しか動かなかった）。
# 1日8回程度までなら、6日間つづけて100%届いていた。
# Threads の投稿と合わせて8回に収まるよう、こちらは4回にする。
#
# 1回あたり拾う件数を増やしてあるので、1日に集まる商品数は変わらない。
# 手で動かしたいときは Actions タブの「Run workflow」から。
# 起こす役は Cloudflare Workers（ops/cron-worker.js）に置いてある。
# ここに schedule を書かないこと。二重に起動して記録が壊れる。
on:
  workflow_dispatch:

# 実行が重なると products.json の書き込みがぶつかる。前のものを待つ。
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # セールの最中だけ、これから始まる商品も拾いにいく。
      # 期間外なら何もせず終わる（events.json の「確定」の予定を見る）。
      # マラソン中は新しいタイムセールが次々に始まるので、
      # 一度きりでは取りこぼす。
      - name: セール中なら開始前の商品も探す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 fetch_rakuten.py --event --scheduled

      # 落ちた理由を実行の要約に残す。
      #
      # 2026-09-06: 10回に2回ここで落ちていた。
      # ログは管理者権限が無いと読めず、原因が分からないまま数日過ぎた。
      # 出力を控えて、落ちたら末尾を要約に貼る。
      - name: 価格を見に行く
        id: watch
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          set -o pipefail
          python3 fetch_rakuten.py --watch 2>&1 | tee .watch_log.txt

      - name: 落ちた理由を残す
        if: failure() && steps.watch.outcome == 'failure'
        run: |
          {
            echo "## 価格の見張りが落ちました"
            echo ""
            echo '```'
            tail -40 .watch_log.txt || echo "（ログが残っていません）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 決まりが本当に鳴るかを、材料を壊して機械で確かめる。
      #
      # 2026-09-07: 手で壊して確かめる限り、確かめ忘れた決まりは静かに死ぬ。
      # 実際に3件、鳴らなくなっていた決まりが見つかった。
      # 「決まり29件、すべて守れています」は、
      # 検査が動いていて初めて意味を持つ。
      - name: 決まりが鳴るかを確かめる
        if: always()
        run: |
          if python3 rules.py --selftest | tee .selftest.txt; then
            :
          else
            {
              echo "## ⚠ 鳴らない決まりがあります"
              echo ""
              echo '```'
              cat .selftest.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::鳴らない決まりがあります。実行の要約を見てください"
          fi

      - name: サイトを作り直す
        run: python3 build.py | tee .build_log.txt

      # 決まりを破っていたら、実行の要約に大きく出す。
      # 以前は警告を出すだけで終了コードは 0 だったので、
      # 自動実行のログに埋もれて誰も気づかなかった。
      # 「今日の分やって」で私が走らせたときにしか見つからない状態だった。
      - name: 決まりを破っていないか
        if: always()
        run: |
          if grep -q "決まりを破っています" .build_log.txt; then
            {
              echo "## ⚠ 決まりを破っています"
              echo ""
              echo '```'
              grep -A2 "決まりを破っています" .build_log.txt
              echo '```'
              echo ""
              echo "直し方は rules.py の各検査のコメントにあります。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::決まりを破っています。実行の要約を見てください"
          else
            echo "決まり、すべて守れています。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # build.py が出した警告を、種類を問わず全部そのまま出す。
      #
      # 2026-09-07: 価格ずれが半日で6件たまった。警告は出ていたが、
      # 終了コードは 0、実行の要約にも出ないので、自動実行では誰も読まなかった。
      # 直る道が「私が手で回したとき」しか無かった。
      #
      # 最初は「合いません」を grep する段を足したが、それでは
      # 新しい検査を足すたびに同じ穴が開く。件名で拾わず、
      # 「直していない警告」が1件でもあれば検査の出力を丸ごと出す。
      - name: 直していない警告を残す
        if: always()
        run: |
          if grep -q "直していない警告" .build_log.txt; then
            {
              echo "## ⚠ 直していない警告があります"
              echo ""
              echo '```'
              sed -n '/^⚠/,$p' .build_log.txt | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::直していない警告があります。実行の要約を見てください"
          fi

      - name: 変化があれば反映する
        run: |
          git config user.name "yasumiru-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ "$(cat .run_changed 2>/dev/null)" = "no" ]; then
            echo "見に行ったが、伝える変化はなかった。反映しない。"
            echo "（価格の確認日が変わるその日の1回目は、動きが無くても反映する）"
            git checkout -- . || true
            exit 0
          fi
          if git diff --quiet && git diff --cached --quiet; then
            echo "変化なし。何もしません。"
            exit 0
          fi
          git add -A
          git commit -F .run_summary.txt
          # 手元からの push と重なったときのために、取り込んでから送る。
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "やり直します ($i)"
            sleep 5
          done
          exit 1

      - name: 実行結果を残す
        if: always()
        run: cat .run_summary.txt >> "$GITHUB_STEP_SUMMARY" || true
