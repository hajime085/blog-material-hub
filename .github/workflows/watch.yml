name: 特価の見張り

# 1日7回、価格を見に行き、変化があればサイトを作り直して反映する。
# Threadsに1日7件の商品を出すので、それに見合うだけ拾いにいく。
# 手で動かしたいときは Actions タブの「Run workflow」から。
on:
  schedule:
    # UTC で指定する。日本時間の 7,11,15,19,22時の「37分」にあたる。
    # 毎時0分は予定実行が集中して遅れるので、半端な分に置く。
    # Threadsの投稿とも時刻をずらして、同時に走らないようにしている。
    # 楽天のセールは10時と20時に始まるものが多いので、
    # その直後（11時・22時）を必ず通るようにしている。
    # 深夜は楽天側の動きも鈍く、見に行っても得るものが少ないので外している。
    - cron: "37 21,0,3,6,9,12,14 * * *"
  workflow_dispatch:

# 実行が重なると products.json の書き込みがぶつかる。前のものを待つ。
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # セールの最中だけ、これから始まる商品も拾いにいく。
      # 期間外なら何もせず終わる（events.json の「確定」の予定を見る）。
      # マラソン中は新しいタイムセールが次々に始まるので、
      # 一度きりでは取りこぼす。
      - name: セール中なら開始前の商品も探す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 fetch_rakuten.py --event --scheduled

      - name: 価格を見に行く
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 fetch_rakuten.py --watch

      - name: サイトを作り直す
        run: python3 build.py

      - name: 変化があれば反映する
        run: |
          git config user.name "yasumiru-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ "$(cat .run_changed 2>/dev/null)" = "no" ]; then
            echo "見に行ったが、伝える変化はなかった。反映しない。"
            echo "（価格の確認日が変わるその日の1回目は、動きが無くても反映する）"
            git checkout -- . || true
            exit 0
          fi
          if git diff --quiet && git diff --cached --quiet; then
            echo "変化なし。何もしません。"
            exit 0
          fi
          git add -A
          git commit -F .run_summary.txt
          # 手元からの push と重なったときのために、取り込んでから送る。
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "やり直します ($i)"
            sleep 5
          done
          exit 1

      - name: 実行結果を残す
        if: always()
        run: cat .run_summary.txt >> "$GITHUB_STEP_SUMMARY" || true
