name: Threadsへ投稿

# 1日10回、1件ずつ出す。商品7件、それ以外3件。
#
# 通販は夜のほうが買われるので、夜8時以降に商品を4件寄せている。
# 楽天のセールが20時開始なのも同じ理由。
# 残りの商品3件は朝と昼に散らす。
#
# 何を出すかは時刻ごとに config の threads.slots で決めてある。
# 1回に複数出すと、同じ時間帯の投稿が互いに食い合って、
# どちらの数字もその時間帯の実力を表さなくなる。1回1件にする。
#
# 毎時0分は世界中の予定実行が集中して大きく遅れるので、17分に置く。
on:
  schedule:
    # UTC で指定する。日本時間の 7,9,12,14,17,19,20,21,23,0時の17分。
    - cron: "17 22,0,3,5,8,10,11,12,14,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "出さずに文面だけ見る"
        type: boolean
        default: false

# 実行が重なると threads_posted.json の書き込みがぶつかる。前のものを待つ。
concurrency:
  group: threads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # トークンは60日で切れる。切れてから気づくと、
      # そのあいだ投稿が止まったままになる。先に確かめる。
      - name: トークンが生きているか見る
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python3 threads.py --check

      - name: Threadsへ出す
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 threads.py --dry-run
          else
            python3 threads.py
          fi

      - name: 出したものを記録する
        run: |
          git config user.name "yasumiru-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- threads_posted.json; then
            echo "出したものはありません。"
            exit 0
          fi
          git add threads_posted.json
          git commit -m "auto: Threadsへ投稿"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "やり直します ($i)"
            sleep 5
          done
          exit 1
