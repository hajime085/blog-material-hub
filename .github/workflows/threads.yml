name: Threadsへ投稿

# 1日6回、1件ずつ出す。
# 通販は夜のほうが買われる。楽天のセールが20時開始なのも同じ理由。
# だから夜は2時間おきに厚く置き、昼は間隔を空ける。
#   午前8時・昼12時・夕方17時 … 1本ずつ
#   夜20時・22時・24時        … 2時間おきに1本ずつ
# 1回に複数出すと、同じ時間帯の投稿が互いに食い合って、
# どちらの数字もその時間帯の実力を表さなくなる。1回1件にする。
# ThreadsのAPIは無料で1日250件まで出せるが、上限まで使う理由はない。
on:
  schedule:
    # UTC で指定する。日本時間の 8,12,17,20,22,24時の「17分」にあたる。
    #
    # 毎時0分は世界中の予定実行が集中する。GitHubの予定実行は
    # 「その時刻以降のどこか」でしか動かないので、混む時刻に置くと大きく遅れる。
    # 実際、0分に置いていたとき83分遅れた回があった。
    # 半端な分にずらすだけで、当たりやすくなる。
    - cron: "17 23,3,8,11,13,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "出さずに文面だけ見る"
        type: boolean
        default: false

# 実行が重なると threads_posted.json の書き込みがぶつかる。前のものを待つ。
concurrency:
  group: threads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # トークンは60日で切れる。切れてから気づくと、
      # そのあいだ投稿が止まったままになる。先に確かめる。
      - name: トークンが生きているか見る
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python3 threads.py --check

      - name: Threadsへ出す
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 threads.py --dry-run
          else
            python3 threads.py
          fi

      - name: 出したものを記録する
        run: |
          git config user.name "yasumiru-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- threads_posted.json; then
            echo "出したものはありません。"
            exit 0
          fi
          git add threads_posted.json
          git commit -m "auto: Threadsへ投稿"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "やり直します ($i)"
            sleep 5
          done
          exit 1
