name: Threadsへ投稿

# 1日10件（商品7・それ以外3）を、時刻ごとの枠に沿って出す。
#
# ■ なぜ「1日4回の起動」で10件出すのか
#
# GitHub の予定実行は、指定した時刻には動かない。
# 8/21〜8/28 の実行記録40回を数えた結果:
#
#     定刻に動いた回     0回
#     遅れ              平均48分・最大77分・最小27分
#
# さらに、1日の予定回数を増やすほど、実行そのものが届かなくなる。
#
#     5〜7回/日 … 配信率 100%（6日間つづけて）
#     11回/日  … 91%
#     14回/日  … 21%
#     17回/日  … 0%
#
# 10件出すために10回起動する、という作りが原因だった。
# なので「1回の起動が長く生きて、複数の枠を見届ける」形に変える。
# 起動は1日4回。1回が約4時間生き、その間の枠を順に出す。
#
# ■ 落ちてもその日のうちに取り返す
#
# 起動が落ちても、次の起動が「まだ出していない枠」を見つけて埋める。
# 4回のうち1回でも動けば、その日の投稿は続く。
# ただし3時間より前の枠は捨てる。夜にまとめて出しても、
# 時間帯ごとの反応を比べる材料にならないため。
# 起こす役は Cloudflare Workers（ops/cron-worker.js）に置いてある。
# ここに schedule を書かないこと。
#
# 8/29 に schedule が復活し、Cloudflare と二重に起動した。
# 4時間生きる回が重なって順番待ちになり、片方が押せなかった記録を
# もう片方が「まだ出していない」と読んで、同じ知識投稿を
# 14:00 と 14:21 に二度出した。
# 起こす役は必ず1つにする。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "出さずに文面だけ見る"
        type: boolean
        default: false
      hours:
        description: "何時間ぶん見届けるか"
        default: "0.75"

# 実行が重なると threads_posted.json の書き込みがぶつかる。前のものを待つ。
concurrency:
  group: threads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # 窓は4時間。詰まったときのために少しだけ余裕を持たせる。
    # GitHub のジョブは6時間で強制終了されるので、それより短くする。
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # トークンは60日で切れる。切れてから気づくと、
      # そのあいだ投稿が止まったままになる。先に確かめる。
      - name: トークンが生きているか見る
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python3 threads.py --check

      - name: いつ動いたかを残す
        run: |
          echo "起動: $(TZ=Asia/Tokyo date '+%m/%d %H:%M') JST" >> "$GITHUB_STEP_SUMMARY"
          echo "きっかけ: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      # 出したそばから記録を送る（--push）。
      # 数時間動き続けるので、最後にまとめて送ると、
      # 途中で切れたときに「出したのに記録が無い」状態になり、
      # 次の起動が同じものをもう一度出してしまう。
      - name: 枠を見届けながら出す
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          H="${{ inputs.hours }}"
          # 既定は45分。以前は4時間だったが、回が重なって順番待ちになり、
          # 押せなかった記録をもう片方が読み落として重複投稿になった。
          # Cloudflare が枠ごとに起こすので、1回が長く生きる必要はない。
          # 1回の起動は「出して終わり」。生き続けさせない。
          #
          # 2026-09-04: 45分生きる作りのまま10分おきに起こしたので、
          # concurrency で後ろの起動が順番待ちになり、
          # 20:10 と 20:30 の枠が出ず、待たされた1本が20:45に流れた。
          # 予定実行が届かなかった頃の名残。いまは Cloudflare が確実に届く。
          H="${H:-0.05}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 threads.py --serve --hours "$H" --dry-run
          else
            python3 threads.py --serve --hours "$H" --push
          fi

      - name: 送り残しがあれば送る
        if: always()
        run: |
          git config user.name "yasumiru-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- threads_posted.json; then
            echo "送り残しはありません。"
            exit 0
          fi
          git add threads_posted.json
          git commit -m "auto: Threadsへ投稿"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "やり直します ($i)"
            sleep 5
          done
          exit 1
